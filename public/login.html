<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAKSHYA 2026 | Login - LBRCE</title>
  <meta name="description" content="Login to LBRCE Lakshya 2026 event portal with email OTP verification.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', var(--font-main); }
    .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .login-card {
      width: 100%; max-width: 440px; background: linear-gradient(180deg, #17233c, #111a2e);
      border: 1px solid var(--border-highlight); border-radius: var(--radius-xl);
      padding: 2.5rem 2.25rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,.7);
      animation: modalPop .3s ease;
    }
    .login-brand { text-align: center; margin-bottom: 1.75rem; }
    .login-brand .brand-badge { display: inline-block; font-size: 1.4rem; padding: .55rem .95rem; margin-bottom: .9rem; }
    .login-brand h1 { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; }
    .login-brand h1 span { color: var(--accent-cyan); }
    .login-brand p { font-size: .82rem; color: var(--text-secondary); margin-top: .3rem; }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-badge">L</div>
        <h1>LAKSHYA <span>2026</span></h1>
        <p>LBRCE National Level Fest • Student Login</p>
      </div>

      <div class="alert-box alert-danger" id="loginErrorBox"><span>⚠️</span><span id="loginErrorMessage"></span></div>
      <div class="alert-box alert-success" id="loginSuccessBox"><span>✓</span><span id="loginSuccessMessage"></span></div>

      <div id="loginStepEmail">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@college.edu" autocomplete="email">
        </div>
        <button class="btn btn-primary" id="btnSendOtp" style="width:100%;justify-content:center">
          <span id="btnSendOtpText">Send OTP to My Email</span>
        </button>
        <p style="font-size:.74rem;color:var(--text-muted);text-align:center;margin-top:.8rem">
          A 6-digit OTP will be sent to your email (valid 5 min). Check inbox &amp; spam.
        </p>
      </div>

      <div id="loginStepOtp" style="display:none">
        <div class="form-group">
          <label class="form-label" for="loginOtp">Enter OTP from your email</label>
          <input type="text" class="form-control otp-input-large" id="loginOtp" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <div style="display:flex;gap:.6rem">
          <button class="btn btn-secondary" id="btnBackToEmail">←</button>
          <button class="btn btn-primary" id="btnVerifyOtp" style="flex:1;justify-content:center">
            <span id="btnVerifyOtpText">Verify &amp; Enter Portal</span>
          </button>
        </div>
        <button class="btn btn-outline btn-sm" id="btnResendOtp" style="margin-top:.7rem;width:100%">Resend OTP</button>
      </div>

      <div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;font-size:.8rem">
        <a href="/home" class="nav-link" id="linkBrowse">Browse events →</a>
        <a href="/admin" class="nav-link">Organizer Login</a>
      </div>
    </div>
  </div>

  <script>
    // Already logged in? Skip straight to the portal.
    if (localStorage.getItem('lakshya_email_token') && localStorage.getItem('lakshya_verified_email')) {
      location.replace('/home');
    }

    const errBox = document.getElementById('loginErrorBox');
    const okBox = document.getElementById('loginSuccessBox');
    const errMsg = document.getElementById('loginErrorMessage');
    const okMsg = document.getElementById('loginSuccessMessage');

    function showErr(m) { errMsg.textContent = m; errBox.style.display = 'flex'; okBox.style.display = 'none'; }
    function showOk(m) { okMsg.textContent = m; okBox.style.display = 'flex'; errBox.style.display = 'none'; }
    function hideMsg() { errBox.style.display = 'none'; okBox.style.display = 'none'; }

    const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

    async function sendOtp() {
      hideMsg();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      if (!validEmail(email)) return showErr('Please enter a valid email address.');
      const btn = document.getElementById('btnSendOtp');
      btn.disabled = true;
      document.getElementById('btnSendOtpText').textContent = 'Sending OTP…';
      try {
        const res = await fetch('/api/auth/request-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, purpose: 'login' })
        });
        const data = await res.json();
        if (!data.success) return showErr(data.message || 'Failed to send OTP.');
        showOk(`OTP sent to ${email}. Check inbox & spam.`);
        document.getElementById('loginStepEmail').style.display = 'none';
        document.getElementById('loginStepOtp').style.display = 'block';
        document.getElementById('loginOtp').focus();
      } catch { showErr('Network error. Please try again.'); }
      finally {
        btn.disabled = false;
        document.getElementById('btnSendOtpText').textContent = 'Send OTP to My Email';
      }
    }

    async function verifyOtp() {
      hideMsg();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const otp = document.getElementById('loginOtp').value.trim();
      if (otp.length !== 6) return showErr('Enter the 6-digit OTP from your email.');
      const btn = document.getElementById('btnVerifyOtp');
      btn.disabled = true;
      document.getElementById('btnVerifyOtpText').textContent = 'Verifying…';
      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, purpose: 'login' })
        });
        const data = await res.json();
        if (!data.success) return showErr(data.message || 'Incorrect OTP.');
        localStorage.setItem('lakshya_verified_email', data.email);
        localStorage.setItem('lakshya_email_token', data.emailToken);
        showOk(`Welcome, ${data.email}! Redirecting…`);
        setTimeout(() => location.replace('/home'), 800);
      } catch { showErr('Network error. Please try again.'); }
      finally {
        btn.disabled = false;
        document.getElementById('btnVerifyOtpText').textContent = 'Verify & Enter Portal';
      }
    }

    document.getElementById('btnSendOtp').addEventListener('click', sendOtp);
    document.getElementById('btnVerifyOtp').addEventListener('click', verifyOtp);
    document.getElementById('btnResendOtp').addEventListener('click', sendOtp);
    document.getElementById('btnBackToEmail').addEventListener('click', () => {
      hideMsg();
      document.getElementById('loginStepOtp').style.display = 'none';
      document.getElementById('loginStepEmail').style.display = 'block';
    });
    document.getElementById('loginEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendOtp(); });
    document.getElementById('loginOtp').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyOtp(); });
    document.getElementById('linkBrowse').addEventListener('click', (e) => {
      if (!localStorage.getItem('lakshya_email_token')) {
        e.preventDefault();
        showErr('Please login with your email OTP first.');
      }
    });
  </script>
</body>
</html>
